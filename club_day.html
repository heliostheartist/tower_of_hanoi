<style>
  :root { --ink:#2B1B18; --red:#B22E1C; --blue:#016BE9; --amber:#FDBA00; --line:#EBD9BF; --cream:#FFF7E3; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { font-family: system-ui, "Segoe UI", sans-serif; color:var(--ink); display:flex; flex-direction:column; background:#fff; }
  header { display:flex; align-items:center; gap:14px; padding:8px 12px; flex-wrap:wrap; }
  header h1 { font-size:22px; font-weight:400; margin:0 auto 0 0; color:var(--red); display:flex; align-items:center; gap:10px; }
  header h1 b { color:var(--blue); font-weight:600; }
  header h1 img { height:40px; width:auto; }
  header label { font-size:14px; }
  select { font:inherit; font-size:14px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  main { flex:1; display:flex; min-height:0; border-top:1px solid var(--line); }
  #left { width:420px; flex:none; padding:8px; }
  #sceneBox { border:2px solid var(--line); border-radius:8px; background:var(--cream); }
  #scene { display:block; width:100%; height:auto; }
  #btns { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  button.act { font:inherit; font-size:17px; color:#fff; background:var(--blue); border:0; border-radius:6px; padding:10px 14px; cursor:pointer; }
  button.act.sec { background:var(--amber); color:var(--ink); font-size:15px; }
  #status { margin-top:12px; min-height:48px; font-size:16px; }
  #status.err { color:var(--red); font-weight:600; } #status.win { color:var(--blue); font-weight:600; }
  #right { flex:1; position:relative; min-width:0; }
  #blocklyDiv { position:absolute; inset:0; }
  #wm { position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.10;

<script>
const $ = (id) => document.getElementById(id);
const HINTS = {
  easy: 'Kéo "chuyển đĩa nhỏ nhất" và "làm nước đi còn lại" vào trong khối "lặp lại". Nếu báo lỗi, thử đổi chiều vòng.',
  mid: 'Dùng khối "chuyển đĩa từ cọc X sang cọc Y". Muốn gọn hơn, hãy thử khối lặp lại và khối điều kiện.',
  adv: 'Chọn cọc bằng số hoặc biến để viết hàm đệ quy: chuyển n-1 đĩa, chuyển đĩa lớn nhất, rồi chuyển n-1 đĩa lại.',
};

/* ===== Khối lệnh ===== */
const peg = (name) => ({ type:'field_dropdown', name, options:[['1','1'],['2','2'],['3','3']] });
Blockly.defineBlocksWithJsonArray([
  // Chế độ Dễ + Vừa: chọn cọc bằng ô dropdown
  { type:'hanoi_move', message0:'chuyển đĩa từ cọc %1 sang cọc %2', args0:[peg('FROM'), peg('TO')],
    previousStatement:null, nextStatement:null, colour:'#B22E1C' },
  { type:'hanoi_small', message0:'chuyển đĩa nhỏ nhất theo vòng %1',
    args0:[{ type:'field_dropdown', name:'DIR', options:[['1 → 2 → 3 → 1','CW'],['1 → 3 → 2 → 1','CCW']] }],
    previousStatement:null, nextStatement:null, colour:'#B22E1C', tooltip:'Đĩa nhỏ nhất nhảy sang cọc kế tiếp theo vòng đã chọn' },
  { type:'hanoi_other', message0:'làm nước đi hợp lệ còn lại',
    previousStatement:null, nextStatement:null, colour:'#B22E1C', tooltip:'Không dùng đĩa nhỏ nhất: chuyển đĩa nhỏ hơn giữa 2 cọc còn lại' },
  { type:'hanoi_until_done', message0:'lặp lại cho đến khi cọc 3 đầy %1 hãy %2',
    args0:[{ type:'input_dummy' }, { type:'input_statement', name:'DO' }],
    previousStatement:null, nextStatement:null, colour:'#C98A00' },
  { type:'hanoi_smaller', message0:'đĩa trên cọc %1 nhỏ hơn đĩa trên cọc %2', args0:[peg('A'), peg('B')],
    output:'Boolean', colour:'#016BE9', tooltip:'Cọc trống được coi là lớn vô hạn' },
  { type:'hanoi_empty', message0:'cọc %1 đang trống', args0:[peg('PEG')], output:'Boolean', colour:'#016BE9' },
  { type:'hanoi_full', message0:'cọc 3 đã đầy đĩa', output:'Boolean', colour:'#016BE9' },
  // Chế độ Khó: chọn cọc bằng khối số / biến
  { type:'hanoi_move_v', message0:'chuyển đĩa từ cọc %1 sang cọc %2',
    args0:[{ type:'input_value', name:'FROM', check:'Number' }, { type:'input_value', name:'TO', check:'Number' }],
    inputsInline:true, previousStatement:null, nextStatement:null, colour:'#B22E1C' },
  { type:'hanoi_top', message0:'cỡ đĩa trên cùng của cọc %1', args0:[{ type:'input_value', name:'PEG', check:'Number' }],
    output:'Number', colour:'#3F8DF0', tooltip:'0 nếu cọc trống' },
  { type:'hanoi_n', message0:'số đĩa', output:'Number', colour:'#3F8DF0' },
]);
const G = Blockly.JavaScript;
G.forBlock['hanoi_move'] = (b) => `move(${b.getFieldValue('FROM')}, ${b.getFieldValue('TO')});\n`;
G.forBlock['hanoi_move_v'] = (b, g) => `move(${g.valueToCode(b, 'FROM', 99) || 1}, ${g.valueToCode(b, 'TO', 99) || 1});\n`;
G.forBlock['hanoi_small'] = (b) => `smallest('${b.getFieldValue('DIR')}');\n`;
G.forBlock['hanoi_other'] = () => 'other();\n';
G.forBlock['hanoi_until_done'] = (b, g) => `while (!done()) {\n${g.addLoopTrap(g.statementToCode(b, 'DO'), b)}}\n`;
G.forBlock['hanoi_smaller'] = (b) => [`smaller(${b.getFieldValue('A')}, ${b.getFieldValue('B')})`, 2];
G.forBlock['hanoi_empty'] = (b) => [`isEmpty(${b.getFieldValue('PEG')})`, 2];
G.forBlock['hanoi_full'] = () => ['done()', 2];
G.forBlock['hanoi_top'] = (b, g) => [`top(${g.valueToCode(b, 'PEG', 99) || 1})`, 2];
G.forBlock['hanoi_n'] = () => ['numDisks()', 2];
G.STATEMENT_PREFIX = 'highlightBlock(%1);\n';
G.addReservedWords('highlightBlock,move,done,smallest,other,smaller,isEmpty,top,numDisks,LoopTrap');
G.INFINITE_LOOP_TRAP = 'if (--LoopTrap < 0) throw "LOOP";\n';

/* ===== Bộ mô phỏng luật ===== */
function simulate(code, n) {
  const pegs = [[], [], []]; for (let i = n; i >= 1; i--) pegs[0].push(i);
  const log = [];
  const rule = (m) => { throw { rule: m }; };
  const chk = (p) => { if (![1, 2, 3].includes(p)) rule('Không có cọc số ' + p); };
  const topOf = (i) => pegs[i].length ? pegs[i][pegs[i].length - 1] : Infinity;
  const api = {
    move(a, b) {
      chk(a); chk(b);
      if (!pegs[a - 1].length) rule('Cọc ' + a + ' đang trống, không có đĩa để chuyển');
      if (topOf(a - 1) > topOf(b - 1)) rule('Sai luật: không được đặt đĩa to lên đĩa nhỏ');
      const d = pegs[a - 1].pop(); log.push({ t:'pick', peg:a });
      pegs[b - 1].push(d); log.push({ t:'drop', peg:b });
    },
    done() { return pegs[2].length === n; },
    isEmpty(p) { chk(p); return pegs[p - 1].length === 0; },
    smaller(x, y) { chk(x); chk(y); return topOf(x - 1) < topOf(y - 1); },
    top(p) { chk(p); const t = topOf(p - 1); return t === Infinity ? 0 : t; },
    numDisks() { return n; },
    smallest(dir) {
      const s = pegs.findIndex((p) => p.length && p[p.length - 1] === 1);
      api.move(s + 1, (dir === 'CW' ? (s + 1) % 3 : (s + 2) % 3) + 1);
    },
    other() {
      if (api.done()) return;
      const s = pegs.findIndex((p) => p.length && p[p.length - 1] === 1);
      const [x, y] = [0, 1, 2].filter((i) => i !== s);
      if (topOf(x) === Infinity && topOf(y) === Infinity) rule('Không còn nước đi nào khác — thử đổi chiều vòng của đĩa nhỏ nhất');
      const [from, to] = topOf(x) < topOf(y) ? [x, y] : [y, x];
      api.move(from + 1, to + 1);
    },
    highlightBlock(id) { if (log.length > 20000) throw 'LOOP'; log.push({ t:'hl', id }); },
  };
  try {
    new Function(...Object.keys(api), 'var LoopTrap = 20000;\n' + code)(...Object.values(api));
    const win = pegs[2].length === n;
    log.push({ t:'end', win, msg: win ? 'Thành công! Đã chuyển hết đĩa sang cọc 3.' : 'Chương trình dừng nhưng chưa chuyển hết đĩa sang cọc 3.' });
  } catch (e) {
    let msg;
    if (e && e.rule) msg = e.rule;
    else if (e === 'LOOP' || e instanceof RangeError) { msg = 'Chương trình lặp mãi không dừng — kiểm tra lại điều kiện dừng'; let k = 0; const c = log.findIndex((x) => x.t === 'pick' && ++k > 20); if (c >= 0) log.length = c; }
    else msg = 'Lỗi: ' + (e && e.message ? e.message : e);
    log.push({ t:'end', win:false, error:true, msg });
  }
  return log;
}

const APC_THEME = Blockly.Theme.defineTheme('apc', { base: Blockly.Themes.Classic, name: 'apc',
  blockStyles: {
    logic_blocks: { colourPrimary:'#016BE9' }, loop_blocks: { colourPrimary:'#C98A00' },
    math_blocks: { colourPrimary:'#0A3F8F' }, variable_blocks: { colourPrimary:'#E8801A' },
    variable_dynamic_blocks: { colourPrimary:'#E8801A' }, procedure_blocks: { colourPrimary:'#B22E1C' } },
  categoryStyles: { logic_category:{colour:'#016BE9'}, loop_category:{colour:'#C98A00'}, math_category:{colour:'#0A3F8F'},
    variable_category:{colour:'#E8801A'}, procedure_category:{colour:'#B22E1C'} } });

/* ===== Vẽ cảnh ===== */
const PEG_X = [70, 200, 330], BASE_Y = 268, DH = 20, COLORS = ['#FDBA00','#E8801A','#B22E1C','#016BE9','#0A3F8F'];
const scene = $('scene');
let vis = { pegs:[[],[],[]], hand:0, arm:1 };
const dw = (d) => 26 + d * 17;
function resetVis(n) { vis = { pegs:[[],[],[]], hand:0, arm:1 }; for (let i = n; i >= 1; i--) vis.pegs[0].push(i); draw(); }
function draw() {
  let s = `<rect x="10" y="${BASE_Y}" width="380" height="10" rx="3" fill="#7A1F12"/>`;
  PEG_X.forEach((x, i) => {
    s += `<rect x="${x - 4}" y="90" width="8" height="${BASE_Y - 90}" fill="#D8B48A"/><text x="${x}" y="292" text-anchor="middle" font-size="13" fill="#7A5A4A">Cọc ${i + 1}</text>`;
    vis.pegs[i].forEach((d, k) => { s += `<rect x="${x - dw(d) / 2}" y="${BASE_Y - (k + 1) * DH}" width="${dw(d)}" height="${DH - 3}" rx="5" fill="${COLORS[d - 1]}"/>`; });
  });
  let arm = `<rect x="-3" y="0" width="6" height="34" fill="#016BE9"/><path d="M-14 34h28v7h-28z" fill="#016BE9"/>`;
  if (vis.hand) arm += `<rect x="${-dw(vis.hand) / 2}" y="44" width="${dw(vis.hand)}" height="${DH - 3}" rx="5" fill="${COLORS[vis.hand - 1]}"/>`;
  scene.innerHTML = s + `<g style="transition:transform .18s" transform="translate(${PEG_X[vis.arm - 1]},8)">${arm}</g>`;
}

/* ===== Chạy chương trình ===== */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let token = 0, workspace = null;
const nDisks = () => +$('nDisks').value;
function setStatus(m, c) { $('status').textContent = m; $('status').className = c || ''; }
async function play() {
  const my = ++token, n = nDisks(), delay = +$('speed').value;
  resetVis(n); setStatus('Đang chạy…');
  const log = simulate(G.workspaceToCode(workspace), n);
  for (const e of log) {
    if (my !== token) return;
    if (e.t === 'hl') { workspace.highlightBlock(e.id); continue; }
    if (e.t === 'pick' || e.t === 'drop') {
      vis.arm = e.peg; draw(); await sleep(delay); if (my !== token) return;
      if (e.t === 'pick') vis.hand = vis.pegs[e.peg - 1].pop(); else { vis.pegs[e.peg - 1].push(vis.hand); vis.hand = 0; }
      draw(); await sleep(delay);
    } else if (e.t === 'end') {
      workspace.highlightBlock(null);
      if (e.win) setStatus('🎉 ' + e.msg, 'win');
      else {
        setStatus('BÍP! ' + e.msg, 'err');
        if (e.error) { scene.classList.add('flash'); await sleep(900); scene.classList.remove('flash'); }
        if (my === token) resetVis(n);
      }
    }
  }
}
function stop() { token++; workspace.highlightBlock(null); resetVis(nDisks()); setStatus('Đã dừng.'); }

/* ===== Bảng khối theo chế độ ===== */
const blk = (t) => ({ kind:'block', type:t });
const num = (v) => ({ shadow:{ type:'math_number', fields:{ NUM:v } } });
const ifElse = { kind:'block', type:'controls_if', extraState:{ hasElse:true } };
const TOOLBOX = {
  easy: { kind:'flyoutToolbox', contents:[blk('hanoi_until_done'), blk('hanoi_small'), blk('hanoi_other')] },
  mid: { kind:'categoryToolbox', contents:[
    { kind:'category', name:'Hành động', colour:'#B22E1C', contents:[blk('hanoi_move')] },
    { kind:'category', name:'Điều kiện', colour:'#016BE9', contents:[blk('controls_if'), ifElse, blk('hanoi_smaller'), blk('hanoi_empty'), blk('hanoi_full'), blk('logic_negate')] },
    { kind:'category', name:'Vòng lặp', colour:'#C98A00', contents:[blk('hanoi_until_done'), { kind:'block', type:'controls_repeat_ext', inputs:{ TIMES:num(3) } }] },
    { kind:'category', name:'Hàm', colour:'#B22E1C', custom:'PROCEDURE' },
  ] },
  adv: { kind:'categoryToolbox', contents:[
    { kind:'category', name:'Hành động', colour:'#B22E1C', contents:[blk('hanoi_move'), { kind:'block', type:'hanoi_move_v', inputs:{ FROM:num(1), TO:num(3) } }] },
    { kind:'category', name:'Cảm biến', colour:'#3F8DF0', contents:[{ kind:'block', type:'hanoi_top', inputs:{ PEG:num(1) } }, blk('hanoi_n'), blk('hanoi_smaller'), blk('hanoi_empty'), blk('hanoi_full')] },
    { kind:'category', name:'Điều kiện', colour:'#016BE9', contents:[blk('controls_if'), ifElse, blk('logic_compare'), blk('logic_operation'), blk('logic_negate')] },
    { kind:'category', name:'Vòng lặp', colour:'#C98A00', contents:[blk('hanoi_until_done'), { kind:'block', type:'controls_repeat_ext', inputs:{ TIMES:num(3) } }, blk('controls_whileUntil')] },
    { kind:'category', name:'Số học', colour:'#0A3F8F', contents:[blk('math_number'), blk('math_arithmetic')] },
    { kind:'category', name:'Biến', colour:'#E8801A', custom:'VARIABLE' },
    { kind:'category', name:'Hàm (đệ quy)', colour:'#B22E1C', custom:'PROCEDURE' },
  ] },
};
function buildWorkspace() {
  if (workspace) workspace.dispose();
  const m = $('mode').value;
  workspace = Blockly.inject('blocklyDiv', { toolbox:TOOLBOX[m], theme:APC_THEME, trashcan:true, grid:{ spacing:24, length:2, colour:'#F3E6D2', snap:true } });
  $('hint').textContent = HINTS[m]; $('hint').classList.remove('hide');
}
function hanoiMoves(n, a, b, c, out) {
  if (n === 0) return out;
  hanoiMoves(n - 1, a, c, b, out); out.push([a, c]); hanoiMoves(n - 1, b, a, c, out); return out;
}
function loadSample() {
  const n = nDisks(); workspace.clear();
  if ($('mode').value === 'easy') {
    const dir = n % 2 === 0 ? 'CW' : 'CCW';
    Blockly.serialization.workspaces.load({ blocks:{ languageVersion:0, blocks:[
      { type:'hanoi_until_done', x:30, y:30, inputs:{ DO:{ block:{ type:'hanoi_small', fields:{ DIR:dir }, next:{ block:{ type:'hanoi_other' } } } } } },
    ] } }, workspace);
    setStatus('Đã nạp đáp án mẫu.');
  } else {
    const moves = hanoiMoves(n, 1, 2, 3, []); let next = null;
    for (let i = moves.length - 1; i >= 0; i--) {
      const b = { type:'hanoi_move', fields:{ FROM:String(moves[i][0]), TO:String(moves[i][1]) } };
      if (next) b.next = { block:next }; next = b;
    }
    next.x = 30; next.y = 30;
    Blockly.serialization.workspaces.load({ blocks:{ languageVersion:0, blocks:[next] } }, workspace);
    setStatus(`Đã nạp đáp án mẫu: ${moves.length} khối. Thử ghép gọn hơn xem!`);
  }
}
$('play').onclick = play; $('reset').onclick = stop; $('hintBtn').onclick = loadSample;
$('hint').onclick = () => $('hint').classList.add('hide');
$('nDisks').onchange = stop;
$('mode').onchange = () => { buildWorkspace(); stop(); };
window.addEventListener('resize', () => Blockly.svgResize(workspace));
buildWorkspace(); resetVis(nDisks());
</script>
</body>
</html>
